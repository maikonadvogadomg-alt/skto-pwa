<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>SK Tools</title>
  <style>*{margin:0;padding:0;box-sizing:border-box}html,body,#root{height:100%;overflow:hidden}</style>
  <script type="module" crossorigin src="./assets/app.js"></script>

  <!-- PWA: Gerado pelo PWA Builder -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#275738">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SK Play">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(r => console.log('[PWA] Service Worker registrado!', r.scope))
          .catch(e => console.error('[PWA] Erro:', e));
      });
    }
  </script>
</head>
<body><div id="root"></div></body>
</html>
